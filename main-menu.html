<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Main Menu</title>
  <link rel="stylesheet" href="style.css" />
<style>
  body {
    background: linear-gradient(-45deg, #2c2354, #3b2e71, #442c77, #2d1b45);
    background-size: 800% 800%;
    animation: softMorph 30s ease infinite;
    font-family: 'Segoe UI', sans-serif;
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  @keyframes softMorph {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  /* ✅ Kart biraz daha geniş ve dengeli */
  .card {
    background: #0e0e0e;
    padding: 60px 80px;
    border-radius: 25px;
    box-shadow: 0 0 50px rgba(0, 0, 0, 0.9);
    text-align: center;
    max-width: 1100px;   /* genişletildi */
    width: 90%;          /* responsive uyum */
  }

  .main-title {
    font-size: 34px;
    font-weight: bold;
    color: #4da8ff;
    margin-bottom: 50px;
  }

  /* 🎯 Grid düzeni */
  .menu-buttons {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 25px 40px; /* dikey ve yatay boşluk biraz açıldı */
    justify-items: center;
    margin-bottom: 50px;
  }

  .menu-buttons a {
    background-color: #333;
    color: white;
    text-decoration: none;
    padding: 16px 28px;
    border-radius: 12px;
    font-size: 17px;
    font-weight: 600;
    transition: background 0.3s, transform 0.2s;
    width: 200px; /* buton genişliği artırıldı */
    text-align: center;
  }

  .menu-buttons a:hover {
    background-color: #555;
    transform: translateY(-3px);
  }

  .exit-button a {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    background: #1a1a1a;
    color: white;
    text-decoration: none;
    padding: 12px 28px;
    border-radius: 10px;
    transition: background 0.3s;
  }

  .exit-button a:hover {
    background: #333;
  }

  .exit-icon {
    width: 20px;
    height: 20px;
  }
</style>

</head>
<body>
  <div class="card">
    <div class="main-title">Main Menu</div>

    <!-- 🎯 Grid içinde 9 buton -->
    <div class="menu-buttons">
      <a href="new-auto-ads.html">Auto Ads</a>
      <a href="real-estate-ads.html">Real Estate</a>
      <a href="business-ads.html">Business Ads</a>
      <a href="work-ads.html">Work Ads</a>
      <a href="dating-ads.html">Dating Ads</a>
      <a href="items-clothes-ads.html">Items & Clothes Ads</a>
      <a href="other-ads.html">Other Ads</a>
      <a href="illegal-items-ads.html">Illegal Items</a>
      <a href="reject-reasons.html">Reject Reasons</a>
    </div>

    <!-- Exit -->
    <div class="exit-button">
      <a href="index.html">
        <img src="https://cdn-icons-png.flaticon.com/512/1828/1828479.png" alt="Logout" class="exit-icon">
        Exit
      </a>
    </div>
  </div>
</body>
</html>
