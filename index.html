<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login</title>
  <link rel="stylesheet" href="login.css">
</head>
<body class="login-body">
  <div class="login-container">
    <h2 class="login-title">Login</h2>
    
    <form id="loginForm">
      <input type="text" id="username" placeholder="Username" required />
      <input type="password" id="password" placeholder="Password" required />
      <button type="submit">Join</button>
    </form>
  </div>

  <script>
    // ---------------------------------------------------------------------
    // KULLANICI LISTESI — her satir bir kisiye ait giris bilgisi.
    // Kendi ekibinizin isimlerini/sifrelerini buraya yazin, satir sayisini
    // istediginiz kadar artirip azaltabilirsiniz (virgulle ayirmayi unutmayin).
    // ---------------------------------------------------------------------
    const USERS = [
      { username: "Nazo",  password: "Nazo1923" },  // mevcut, degismedi
      { username: "USER2", password: "PASSWORD2" }, // <-- kendi bilginizle degistirin
      { username: "USER3", password: "PASSWORD3" },
      { username: "USER4", password: "PASSWORD4" },
      { username: "USER5", password: "PASSWORD5" },
      { username: "USER6", password: "PASSWORD6" },
      { username: "USER7", password: "PASSWORD7" },
    ];

    document.getElementById("loginForm").addEventListener("submit", function (e) {
      e.preventDefault();
      const username = document.getElementById("username").value;
      const password = document.getElementById("password").value;

      const found = USERS.some(u => u.username === username && u.password === password);

      if (found) {
        window.location.href = "welcome.html";
      } else {
        alert("Hatalı kullanıcı adı veya şifre.");
      }
    });
  </script>
</body>
</html>
