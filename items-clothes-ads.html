<!-- Fuse.js for fuzzy search -->
<script src="https://cdn.jsdelivr.net/npm/fuse.js/dist/fuse.min.js"></script>

<script type="module">
  // item-list.js dosyasından itemList'i İÇE AKTAR
  import { itemList } from './item-list.js'; 

  // 1. Fuse.js ayarları
  const fuse = new Fuse(itemList.map(name => ({ name })), {
    includeScore: true,
    threshold: 0.4,
    keys: ["name"]
  });

  document.getElementById("itemSearch").addEventListener("input", function () {
    const query = this.value.trim();
    // ... (Arama kodunun geri kalanı aynı) ...
    const results = query ? fuse.search(query).slice(0, 20) : [];
    
    // ... (Geri kalan arama mantığı kodunuz buraya gelir) ...
    const list = document.getElementById("searchResults");
    list.innerHTML = "";
    list.classList.remove("hidden");

    if (results.length > 0) {
      results.forEach(({ item }) => {
        const li = document.createElement("li");
        li.textContent = item.name;
        li.className = "px-2 py-1 hover:bg-blue-600 rounded cursor-pointer";

        li.addEventListener("click", () => {
          document.getElementById("itemSearch").value = item.name;

          const selects = document.querySelectorAll(".item-select");
          for (const select of selects) {
            if (select.value === "") {
              const option = document.createElement("option");
              option.value = item.name;
              option.textContent = item.name;
              option.selected = true;
              select.appendChild(option);
              break;
            }
          }

          list.innerHTML = "";
          list.classList.add("hidden");
        });

        list.appendChild(li);
      });
    } else if (query) {
      const li = document.createElement("li");
      li.textContent = "No matching item found.";
      li.className = "text-red-400 px-2";
      list.appendChild(li);
    }
  }); 
  
  // ÖNEMLİ: navigateTo fonksiyonu artik modül içinde GLOBAL'e bağlanmamalıdır.
  // Bu nedenle navigateTo'yu bu modülün DIŞINA taşıyoruz.
</script>
