<script>
function parsePriceValue(price) {
  const str = price.toLowerCase().replace(/\$/g, "").replace(/\s+/g, "").trim();
  if (str.includes("m")) return parseFloat(str.replace("m", "")) * 1_000_000;
  if (str.includes("k")) return parseFloat(str.replace("k", "")) * 1_000;
  return parseFloat(str.replace(/,/g, ""));
}

function formatPrice(raw) {
  const value = parsePriceValue(raw);
  if (isNaN(value)) return "Negotiable";
  if (value >= 1_000_000) {
    const millions = (value / 1_000_000).toFixed(1).replace(/\.0$/, "");
    return `$${millions} Million`;
  } else {
    return `$${value.toLocaleString("en-US").replace(/,/g, ".")}`;
  }
}

function generateAd() {
  const typeBtn = document.querySelector('.ad-type-btn.bg-blue-700');
  const type = typeBtn?.dataset.type || 'Listing';

  const propertyNumberRaw = document.getElementById("propertyNumber").value.trim();
  const location = document.getElementById("location").value.trim();
  const price = document.getElementById("price").value.trim();

  const rawNumbers = propertyNumberRaw
  ? propertyNumberRaw.split(/,|and/i).map(p => p.trim()).slice(0, 2)
  : [];

const propertyNumbers = rawNumbers.map(n => `№${n}`);

const hasNumber = propertyNumbers.length > 0;
const isDoubleNumber = propertyNumbers.length === 2;

  // ✅ Property türü
  const selectedTypes = Array.from(document.querySelectorAll('input[name="propertyTypeChoice"]:checked'))
    .map(el => el.value.toLowerCase());

  const pluralMap = {
    "house": "houses",
    "apartment": "apartments",
    "mansion": "mansions",
    "casino penthouse": "casino penthouses"
  };

  let typeText = "a property";

  if (selectedTypes.length === 1) {
    let single = selectedTypes[0];
    if (single === "villa") single = "mansion";

    if (isDoubleNumber && pluralMap[single]) {
      typeText = pluralMap[single];
    } else if (single === "casino penthouse") {
      typeText = hasNumber ? "Casino penthouse" : "a Casino penthouse";
    } else {
      const article = /^[aeiou]/.test(single) ? "an" : "a";
      typeText = hasNumber ? single : `${article} ${single}`;
    }

  } else if (selectedTypes.length === 2) {
    const typesFormatted = selectedTypes.map(t => {
      if (t === "villa") t = "mansion";
      if (t === "casino penthouse") return hasNumber ? "Casino penthouse" : "a Casino penthouse";
      const art = /^[aeiou]/.test(t) ? "an" : "a";
      return hasNumber ? t : `${art} ${t}`;
    });
    typeText = `${typesFormatted[0]} and ${typesFormatted[1]}`;
  }

  // ✅ Başlık
  let ad = `${type} ${typeText}`;

  if (propertyNumbers.length === 1) {
    ad += ` ${propertyNumbers[0]}`;
  } else if (propertyNumbers.length === 2) {
    ad += ` ${propertyNumbers[0]} and ${propertyNumbers[1]}`;
  }

  // ✅ Özellikler
  const features = [];

  if (document.querySelector('input[value="Garden"]')?.checked) features.push("a garden");

  const garage = document.getElementById("garage")?.value;
  if (["2 g.s.", "5 g.s.", "9 g.s.", "25 g.s."].includes(garage)) features.push(garage);

  const warehouse = document.getElementById("warehouse")?.value;
  if (["3 w.h.", "4 w.h.", "5 w.h."].includes(warehouse)) features.push(warehouse);

  if (document.querySelector('input[value="Custom Interior"]')?.checked) features.push("custom interior");
  if (document.querySelector('input[value="Insurance"]')?.checked) features.push("insurance");

  const extras = ["Helipad", "Tennis Court", "Long Driveway", "Swimming Pool"];
  extras.forEach(val => {
    if (document.querySelector(`input[value="${val}"]`)?.checked) {
      features.push(val.toLowerCase());
    }
  });

  const viewSelect = document.querySelector("select[name='view']");
  const view = viewSelect ? viewSelect.value : "";
  if (view && view !== "--") {
  const art = /^[aeiou]/.test(view.toLowerCase()) ? "an" : "a";
  features.push(`${art} ${view.toLowerCase()} view`);
}
  if (features.length > 0) {
    ad += ` with ${features.length === 1
      ? features[0]
      : features.slice(0, -1).join(", ") + " and " + features[features.length - 1]}`;
  }

  // ✅ Lokasyon
  if (location && location !== "Select Location") {
    ad += ` ${location}`;
  }

  // ✅ Fiyat etiketi
  let label = "Price";
  if (type === "Looking to rent" || type === "Buying") label = "Budget";
  else if (type === "Renting out") label = "Rent";

  const numericPrice = parsePriceValue(price);
  const showNegotiable = (
    ["Selling", "Buying"].includes(type) &&
    ((selectedTypes.includes("house") && numericPrice < 1_000_000) ||
     (selectedTypes.includes("apartment") && numericPrice < 2_000_000))
  );

  if (!isNaN(numericPrice) && numericPrice > 0) {
    ad += `. ${label}: ${formatPrice(price)}`;
  } else {
    ad += `. ${label}: Negotiable`;
  }

// ✅ Son nokta - ama rakamla bitiyorsa ekleme
if (!/\d$/.test(ad)) {
  ad += ".";
}
  // ✅ Ekrana yaz
  document.getElementById("output").innerText = ad;
}

function copyAd() {
  const text = document.getElementById("output").innerText;
  if (!text || text === "Ready to post ad will appear here...") return;

  navigator.clipboard.writeText(text).then(() => {
    const msg = document.getElementById("copyMsg");
    msg.classList.remove("hidden");
    setTimeout(() => msg.classList.add("hidden"), 3000);
  });

  // ✅ Tüm text input ve selectleri sıfırla
  document.querySelectorAll('input[type="text"], input[type="number"], input[type="checkbox"], input[type="radio"], select').forEach(el => {
    if (el.type === "checkbox" || el.type === "radio") el.checked = false;
    else el.value = "";
  });

  // ✅ Seçili buton rengini kaldır
  document.querySelectorAll(".ad-type-btn").forEach(btn => {
    btn.classList.remove("bg-blue-700");
  });

  // ✅ Çıktı alanını sıfırla
  document.getElementById("output").innerText = "Ready to post ad will appear here...";
}
  // Buton aktiflik ayarlayıcı
document.querySelectorAll(".ad-type-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".ad-type-btn").forEach(b => b.classList.remove("bg-blue-700"));
    btn.classList.add("bg-blue-700");
  });
});

function navigateTo(page) {
  window.location.href = page;
}

document.querySelectorAll(".ad-type-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      document.querySelectorAll(".ad-type-btn").forEach(b => b.classList.remove("active-btn"));
      btn.classList.add("active-btn");
    });
  });
</script>
