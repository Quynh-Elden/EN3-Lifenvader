<script>
  function navigateTo(page) {
    window.location.href = page;
  }

  document.addEventListener("DOMContentLoaded", () => {
    const checkboxes = document.querySelectorAll('input[name="adType"]');
    checkboxes.forEach(cb => {
      cb.addEventListener('change', () => {
        if (cb.checked && cb.value !== 'sell_and_trade') {
          checkboxes.forEach(other => {
            if (other !== cb && other.value !== 'sell_and_trade') other.checked = false;
          });
        }

        const selected = Array.from(document.querySelectorAll('input[name="adType"]:checked')).map(e => e.value);
        const showTarget = selected.includes('sell_and_trade') || selected.includes('trade');
        document.getElementById('targetBusinessWrapper').style.display = showTarget ? 'block' : 'none';
      });
    });
  });

  function generateAd() {
    const adTypes = Array.from(document.querySelectorAll('input[name="adType"]:checked')).map(el => el.value);
    const kind = document.getElementById('kind').value;
    const number = document.getElementById('number').value.trim();
    const priceInput = document.getElementById('price').value.trim();
    const isPlantation = kind.toLowerCase().includes("plantation");

    function formatPrice(value) {
      value = value.toLowerCase().replace('$', '').trim();
      if (value.endsWith('m')) {
        return `$${value.replace('m', '')} Million.`;
      } else if (value.endsWith('k')) {
        return `$${parseInt(value.replace('k', '')) * 1000}.`;
      } else if (value) {
        return `$${Number(value).toLocaleString()}.`;
      }
      return "Negotiable.";
    }

    const formattedPrice = formatPrice(priceInput);
    let adText = "Ready to post ad will appear here...";

    const targetKind = document.getElementById('targetKind').value;
    if ((adTypes.includes('sell_and_trade') || adTypes.includes('trade')) && targetKind) {
      adText = adTypes.includes('sell_and_trade')
        ? `Selling or trading ${kind} business for ${targetKind} business. Price: ${formattedPrice}`
        : `Trading ${kind} business for ${targetKind} business.`;
    } else if (adTypes.includes('sell') && adTypes.includes('trade')) {
      adText = `Selling or trading ${kind} business. Price: ${formattedPrice}`;
    } else if (adTypes.includes('sell')) {
      adText = number && !isPlantation
        ? `Selling ${kind} №${number}. Price: ${formattedPrice}`
        : `Selling ${kind} business. Price: ${formattedPrice}`;
    } else if (adTypes.includes('buy')) {
      adText = number && !isPlantation
        ? `Buying ${kind} №${number}. Budget: ${formattedPrice}`
        : `Buying ${kind} business. Budget: ${formattedPrice}`;
    } else if (adTypes.includes('trade')) {
      adText = `Trading ${kind} business.`;
    }

    document.getElementById('result').innerText = adText;
  }

  function copyAd() {
    const resultBox = document.getElementById('result');
    navigator.clipboard.writeText(resultBox.innerText).then(() => {
      document.getElementById('kind').value = "";
      document.getElementById('number').value = "";
      document.getElementById('price').value = "";
      document.getElementById('targetKind').value = "";
      resultBox.innerText = "e.g.: Ready for posting";
      const msg = document.getElementById('successMessage');
      msg.style.display = 'block';
      setTimeout(() => msg.style.display = 'none', 3000);
    });
  }
</script>

<script>
  new TomSelect("#kind", {
    create: false,
    sortField: {
      field: "text",
      direction: "asc"
    },
    placeholder: "Search or select a business"
  });

  new TomSelect("#targetKind", {
    create: false,
    sortField: {
      field: "text",
      direction: "asc"
    },
    placeholder: "Search or select a target business"
  });

  document.querySelectorAll(".ad-type-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".ad-type-btn").forEach(b => b.classList.remove("active-btn"));
    btn.classList.add("active-btn");
    document.querySelectorAll('input[name="adType"]').forEach(i => i.checked = false);
    const value = btn.getAttribute("data-type");
    document.querySelector(`input[name="adType"][value="${value}"]`).checked = true;
    const showTarget = value === "sell_and_trade" || value === "trade";
    document.getElementById("targetBusinessWrapper").style.display = showTarget ? "block" : "none";
  });
});
